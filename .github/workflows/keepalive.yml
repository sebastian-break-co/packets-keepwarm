name: keep-repo-active
# GitHub turns off scheduled workflows in a public repo after 60 days with no commits.
# This makes one small commit a month so keep-warm is never switched off.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"last keepalive: %Y-%m-%d" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: monthly keepalive" || echo "nothing to commit"
          git push
